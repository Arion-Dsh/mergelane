- name: Check Homebrew publishing prerequisites
  if: github.event_name == 'workflow_dispatch' && inputs.tag != 'dry-run'
  shell: bash
  env:
    GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
  run: |
    test -n "$GH_TOKEN" || { echo "Configure HOMEBREW_TAP_TOKEN before releasing." >&2; exit 1; }
    gh api repos/Arion-Dsh/homebrew-tap --silent
- name: Select pinned Rust toolchain
  run: rustup show
- name: Check formatting
  run: cargo fmt --check
- name: Check all targets and features
  run: cargo check --locked --all-targets --all-features
- name: Run Clippy
  run: cargo clippy --locked --all-targets --all-features -- -D warnings
- name: Run tests before packaging
  run: cargo test --locked --all-features
