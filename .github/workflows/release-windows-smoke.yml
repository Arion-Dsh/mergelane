name: Release Windows package smoke

on:
  workflow_call:

permissions:
  contents: read

jobs:
  install:
    name: Windows one-command install and token echo
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-build-local-x86_64-pc-windows-msvc
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-build-global
          path: packages
      - name: Set up Windows pseudoconsole
        run: >-
          python -m pip install --only-binary=:all: pywinpty==3.1.2
      - name: Test Windows one-command install and token echo
        shell: powershell
        run: python scripts/smoke_installer.py packages x86_64-pc-windows-msvc
