[package]
name = "mergelane"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
description = "MCP collaboration tools for Gitea, Plane, GitHub, GitLab, and Jira"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Arion-Dsh/mergelane"
homepage = "https://github.com/Arion-Dsh/mergelane"
keywords = ["mcp", "agents", "gitea", "plane", "collaboration"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[package.metadata.dist]
dist = true

[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "io-std", "process", "fs"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
