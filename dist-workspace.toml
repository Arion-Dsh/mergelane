[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = ["github"]
# The release workflow is generated and checked by scripts/generate_release_workflow.py.
allow-dirty = ["ci"]
installers = ["shell", "powershell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
tap = "Arion-Dsh/homebrew-tap"
publish-jobs = ["homebrew"]
pr-run-mode = "plan"
dispatch-releases = true
github-attestations = true
github-attestations-phase = "host"
checksum = "sha256"
github-build-setup = "../release-check-steps.yml"
